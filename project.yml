name: WakeMeUp
options:
  bundleIdPrefix: com.oanarinaldi
  deploymentTarget:
    iOS: '26.1'
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: HBD3XXQK45
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '2'
targets:
  WakeMeUp:
    type: application
    platform: iOS
    sources: [Sources, Resources]
    dependencies:
      - target: WakeAlarmActivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oanarinaldi.wakemeup
        TARGETED_DEVICE_FAMILY: '1,2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Wake Me Up
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSAlarmKitUsageDescription: Wake Me Up schedules your chosen morning alarms, including when the app is closed.
        NSCameraUsageDescription: Optionally count push-ups or scan destination codes on your device. Camera images are never recorded or uploaded.
        NSSupportsLiveActivities: true
        NSMotionUsageDescription: Optionally measure movement during your dance ritual. Motion data stays on your device.
        ITSAppUsesNonExemptEncryption: false
        UIUserInterfaceStyle: Light
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
  WakeAlarmActivity:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Sources/WakeMetadata.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oanarinaldi.wakemeup.activity
        TARGETED_DEVICE_FAMILY: '1,2'
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Wake Me Up
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  WakeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: WakeMeUp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  WakeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: WakeMeUp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  WakeMeUp:
    build:
      targets:
        WakeMeUp: all
    test:
      targets: [WakeTests, WakeUITests]
  WakeStoreKit:
    build:
      targets:
        WakeMeUp: all
    run:
      storeKitConfiguration: UITests/WakeProducts.storekit
    test:
      environmentVariables:
        WAKE_STOREKIT_TEST: "1"
      targets: [WakeUITests]
  WakeAlarmIntegration:
    build:
      targets:
        WakeMeUp: all
    test:
      environmentVariables:
        WAKE_ALARM_TEST: "1"
      targets: [WakeUITests]
